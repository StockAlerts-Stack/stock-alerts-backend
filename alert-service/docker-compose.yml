version: "3.8"

services:
  alert-service:
    build: .
    container_name: alert-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: alert_db
      DB_USERNAME: admin
      DB_PASSWORD: adminpassword
      RABBITMQ_HOST: ${RABBITMQ_HOST:-localhost}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stock-alert-network

  postgres:
    image: postgres:16-alpine
    container_name: alert-postgres
    environment:
      POSTGRES_DB: alert_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d alert_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock-alert-network

networks:
  stock-alert-network:
    driver: bridge
