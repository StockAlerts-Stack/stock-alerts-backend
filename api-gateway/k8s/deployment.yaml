---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: stock-alert
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: stock-alert
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 3

---
# Exposes the gateway outside the cluster (NodePort for single-node VPS)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: stock-alert
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
