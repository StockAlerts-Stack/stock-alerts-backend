server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Global default filters applying to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      routes:
        # ---------------------------------------------------------------
        # Product Service
        # /api/products/** → strip /api → product-service:/products/**
        # ---------------------------------------------------------------
        - id: product-service
          uri: http://product-service:8081
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1

        # ---------------------------------------------------------------
        # Inventory Service
        # /api/inventory/** → strip /api → inventory-service:/inventory/**
        # ---------------------------------------------------------------
        - id: inventory-service
          uri: http://inventory-service:8082
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1

        # ---------------------------------------------------------------
        # Alert Service
        # /api/alerts/** → strip /api → alert-service:/alerts/**
        # ---------------------------------------------------------------
        - id: alert-service
          uri: http://alert-service:8083
          predicates:
            - Path=/api/alerts/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.stockalert.gateway: INFO
